<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yorubania</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container" style="padding-top: 64px; max-width: 420px;">
      <p class="section-label">Yorubania</p>
      <h1>Sign in</h1>
      <p class="muted">
        Accounts are by invitation only. If you've received a link from a
        family member or an admin, use <a href="/claim.html">the claim page</a>
        instead.
      </p>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />

        <button type="submit">Sign in</button>
      </form>

      <div id="message"></div>
    </div>

    <script type="module" src="/src/pages/login.ts"></script>
  </body>
</html>
