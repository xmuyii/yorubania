<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claim your account — Yorubania</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container" style="padding-top: 64px; max-width: 420px;">
      <p class="section-label">Welcome to Yorubania</p>
      <h1 id="welcome-heading">Claim your account</h1>
      <p class="muted" id="welcome-sub">Loading your invitation…</p>

      <form id="claim-form" style="display:none">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Choose a password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />

        <button type="submit">Claim account</button>
      </form>

      <div id="message"></div>
    </div>

    <script type="module" src="/src/pages/claim.ts"></script>
  </body>
</html>
