<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Education — Yorubania</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="nav-root"></div>
    <div class="container" style="padding-top: 40px;">
      <section class="section">
        <p class="section-label">Learning</p>
        <h1>Education</h1>
        <p class="muted">Teaching and learning materials, open to every member.</p>
        <div id="materials-list" class="muted">Loading…</div>
      </section>

      <section class="section" id="upload-section" style="display:none">
        <h2>Add a material</h2>
        <p class="muted">First upload the file to your family media, then reference its media ID here.</p>
        <form id="material-form">
          <label for="material-title">Title</label>
          <input type="text" id="material-title" required />
          <label for="material-description">Description</label>
          <textarea id="material-description" rows="2"></textarea>
          <label for="material-media-id">Media asset ID</label>
          <input type="text" id="material-media-id" required />
          <button type="submit">Add</button>
        </form>
        <div id="material-message"></div>
      </section>
    </div>
    <script type="module" src="/src/pages/education.ts"></script>
  </body>
</html>
